<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow"><title>Anime Manager | Bezels Admin</title><link rel="stylesheet" href="/_astro/anime.Bn_lVP4Q.css"></head><body><main class="page"><header class="topbar"><div><a href="/admin/dashboard/" class="back">← Dashboard</a><div class="eyebrow">BEZELS CONTENT MANAGEMENT</div><h1>Anime Manager</h1><p class="subtitle">Add, edit and manage your anime database.</p></div><div class="total-box"><span>Total Anime</span><strong id="total-count">—</strong></div></header><section class="editor"><div class="editor-heading"><div><h2 id="form-heading">Add New Anime</h2><p>Add anime information to your Bezels database.</p></div><button type="button" id="reset-button" class="secondary">Clear Form</button></div><form id="anime-form"><div class="form-grid"><div class="field"><label for="anime-id">Anime ID / Slug *</label><input id="anime-id" name="id" placeholder="e.g. attack-on-titan" required></div><div class="field"><label for="anime-title">Anime Title *</label><input id="anime-title" name="title" placeholder="e.g. Attack on Titan" required></div><div class="field"><label for="anime-year">Release Year</label><input id="anime-year" name="year" type="number" min="1900" max="2100" placeholder="2013"></div><div class="field"><label for="anime-episodes">Episodes</label><input id="anime-episodes" name="episodes" type="number" min="0" placeholder="25"></div><div class="field"><label for="anime-status">Status</label><input id="anime-status" name="status" placeholder="e.g. Finished, Airing"></div><div class="field full"><label for="anime-poster">Poster Image URL</label><input id="anime-poster" name="poster" type="url" placeholder="https://example.com/poster.jpg"></div><div class="field full"><label for="anime-genres">Genres</label><input id="anime-genres" name="genres" placeholder="Action, Adventure, Fantasy"><small>Separate each value with a comma.</small></div><div class="field full"><label for="anime-moods">Moods</label><input id="anime-moods" name="moods" placeholder="Dark, Emotional, Exciting"></div><div class="field full"><label for="anime-story-types">Story Types</label><input id="anime-story-types" name="storyTypes" placeholder="Revenge, Survival, Mystery"></div><div class="field full"><label for="anime-protagonist-types">Protagonist Types</label><input id="anime-protagonist-types" name="protagonistTypes" placeholder="Overpowered, Underdog, Anti-Hero"></div><div class="field full"><label for="anime-content-notes">Content Notes</label><input id="anime-content-notes" name="contentNotes" placeholder="Violence, Mature Themes"></div><div class="field full"><label for="anime-description">Description</label><textarea id="anime-description" name="description" rows="4" placeholder="Write a short anime description..."></textarea></div></div><div class="form-actions"><button type="submit" id="save-button" class="primary">Save Anime</button><button type="button" id="cancel-button" class="secondary">Cancel Editing</button></div><p id="form-message" role="status"></p></form></section><section class="library"><div class="library-heading"><div><h2>Anime Library</h2><p>All anime currently stored in your database.</p></div><input id="search-input" class="search" type="search" placeholder="Search anime..."></div><p id="list-message" role="status">Checking admin access...</p><div id="anime-list" class="anime-grid"></div><nav id="pagination" class="pagination" aria-label="Anime pages" hidden><button type="button" id="prev-page" class="page-button">← Previous</button><div id="page-numbers" class="page-numbers"></div><button type="button" id="next-page" class="page-button">Next →</button></nav><p id="page-info" class="page-info" aria-live="polite"></p></section></main></body></html><script type="module" src="/_astro/anime.astro_astro_type_script_index_0_lang.B5uDzrnd.js"></script>
